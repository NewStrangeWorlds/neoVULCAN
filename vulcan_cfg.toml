# HD189 configuration with the 2025 SNCHO photo network.
#
# Run with:  python vulcan.py -c HD189.cfg

[network]
atom_list            = ["H", "O", "C", "N", "S", "He"]
network              = "thermo/SNCHO_photo_network_2025.txt"
gibbs_text           = "thermo/gibbs_text.txt"
com_file             = "thermo/all_compose.txt"
cross_folder         = "thermo/photo_cross/"
use_lowT_limit_rates = false
remove_list          = []

[paths]
atm_file         = "atm/atm_HD189_Kzz.txt"
sflux_file       = "atm/stellar_flux/sflux-HD189_Moses11.txt"
top_BC_flux_file = "atm/BC_top.txt"
bot_BC_flux_file = "atm/BC_bot.txt"
vul_ini          = "output/"
output_dir       = "output/"
plot_dir         = "plot/"
movie_dir        = "plot/movie/"
out_name         = "HD189-test.vul"

[elements]
use_solar          = true
ini_mix            = "EQ"
fastchem_met_scale = 1.0

[elements.metal_abundances]
# Customized abundances (only used when use_solar = false; reference values
# for the HD189 chemistry runs).
O  = 5.37e-4
C  = 2.95e-4
N  = 7.08e-5
S  = 1.41e-5
He = 0.0838

[elements.const_mix]
# H2 = 1 - 2.7761e-4 * 2 * 4 / 2 = 1 - 0.0011104
CH4 = 5.5522e-4
O2  = 4.807e-4
He  = 0.09691
N2  = 8.1853e-5
H2  = 0.99888956

[atmosphere]
atm_base     = "H2"
rocky        = false
nz           = 120
P_b          = 1.0e9
P_t          = 1.0e-2
use_Kzz      = true
use_moldiff  = true
use_vm_mol   = false
use_vz       = false
atm_type     = "file"
Kzz_prof     = "file"
K_max        = 1.0e5
K_p_lev      = 0.1
vz_prof      = "const"
gs           = 2140.0   # HD189 surface gravity (cm/s^2)
Tiso         = 1000.0
para_warm    = [120.0, 1500.0, 0.1, 0.02, 1.0, 1.0]
# para_anaTP omitted -> aliased to para_warm
const_Kzz    = 1.0e10
const_vz     = 0.0
update_frq   = 100
r_star       = 0.805
# Rp = 1.138 * 7.1492e9
Rp           = 8.1357896e9
orbit_radius = 0.03142
sl_angle_deg = 48.0
f_diurnal    = 1.0     # tidally-locked hot Jupiter

[photochemistry]
# use_photo was `0` in the legacy file (Python integer falsy) — i.e. disabled.
use_photo              = false
use_ion                = false
scat_sp                = ["H2", "He"]
T_cross_sp             = []
edd                    = 0.5
dbin1                  = 0.1
dbin2                  = 2.0
dbin_12trans           = 240.0
ini_update_photo_frq   = 100
final_update_photo_frq = 5

[boundary_conditions]
use_topflux        = false
use_botflux        = false
use_fix_sp_bot     = {}
diff_esc           = ["H"]
max_flux           = 1.0e13
use_sat_surfaceH2O = true

[condensation]
use_condense                  = false
use_settling                  = false
use_relax                     = []
humidity                      = 1.0
start_conden_time             = 0.0
stop_conden_time              = 1.0e5
condense_sp                   = []
non_gas_sp                    = []
fix_species                   = []
fix_species_time              = 0.0   # explicit 0 in the legacy file (not aliased)
fix_species_from_coldtrap_lev = true
use_ini_cold_trap             = true

[condensation.r_p]
H2O_l_s = 5.0e-3

[condensation.rho_p]
H2O_l_s = 1.0

[solver]
ode_solver        = "Ros2"
use_pi_controller = false
use_print_prog    = true
use_print_delta   = false
print_prog_num    = 500
dttry             = 1.0e-10
trun_min          = 1.0e2
runtime           = 1.0e22
dt_min            = 1.0e-14
# dt_max omitted -> derived as runtime * 1e-5
dt_var_max        = 2.0
dt_var_min        = 0.5
count_min         = 120
count_max         = 10000
atol              = 1.0e-1
mtol              = 1.0e-22
mtol_conv         = 1.0e-20
pos_cut           = 0.0
nega_cut          = -1.0
loss_eps          = 1.0e-1
yconv_cri         = 0.01
slope_cri         = 1.0e-4
yconv_min         = 0.1
flux_cri          = 0.1
flux_atol         = 1.0
st_factor         = 0.5
conv_step         = 500
conver_ignore     = []
rtol              = 0.25
post_conden_rtol  = 0.1
use_adapt_rtol    = true
rtol_min          = 0.01
rtol_max          = 2.5

[output]
output_humanread = false
use_shark        = false
save_evolution   = false
save_evo_frq     = 10
y_time_freq      = 1

[plotting]
plot_TP        = false
use_live_plot  = false
use_live_flux  = false
use_plot_end   = false
use_plot_evo   = false
use_save_movie = false
use_flux_movie = false
plot_height    = false
use_PIL        = true
live_plot_frq  = 10
# save_movie_rate omitted -> aliased to live_plot_frq
plot_spec      = ["H2O", "CH4", "CO", "CO2", "NH3", "HCN", "H2S", "SO2"]
