# Earth atmospheric configuration for neoVULCAN.
# Converted from vulcan_cfg_Earth.py.
#
# Run with:  python vulcan.py -c Earth.cfg

[network]
atom_list            = ["H", "O", "C", "Ar", "N", "S"]
network              = "thermo/SNCHO_full_photo_network.txt"
gibbs_text           = "thermo/gibbs_text.txt"
com_file             = "thermo/all_compose.txt"
cross_folder         = "thermo/photo_cross/"
use_lowT_limit_rates = false
remove_list          = [315, 316]   # reactions to switch off (pairs of indices)

[paths]
atm_file         = "atm/atm_Earth_Jan_Kzz.txt"
sflux_file       = "atm/stellar_flux/Gueymard_solar.txt"
top_BC_flux_file = "atm/"
bot_BC_flux_file = "atm/BC_bot_Earth.txt"
vul_ini          = "output/"
output_dir       = "output/"
plot_dir         = "plot/"
movie_dir        = "plot/movie/"
out_name         = "Earth-rtol005.vul"

[elements]
use_solar          = false   # using customized abundances below
ini_mix            = "const_mix"
fastchem_met_scale = 1.0

[elements.metal_abundances]
# customized elemental abundances (only used when use_solar = false AND ini_mix = "EQ")
# Earth has ini_mix = "const_mix" so these are reference only.
# O_H = 6.0618e-4 * 0.85
O  = 5.15253e-4
C  = 2.7761e-4
N  = 8.1853e-5
S  = 1.3183e-5
He = 0.09692

[elements.const_mix]
# uniform (pressure-independent) mixing ratios for the initial state
N2  = 0.78
O2  = 0.20
H2O = 1.0e-6
CO2 = 4.0e-4
Ar  = 9.34e-3
SO2 = 2.0e-10

[atmosphere]
atm_base     = "N2"    # bulk gas — affects molecular diffusion, settling
rocky        = true
nz           = 120
P_b          = 1.0e6   # surface pressure (dyne/cm^2)  ~ 1 bar
P_t          = 5.0e-2  # top-of-atmosphere pressure
use_Kzz      = true
use_moldiff  = true
use_vm_mol   = false
use_vz       = false
atm_type     = "file"
Kzz_prof     = "file"
K_max        = 1.0e5
K_p_lev      = 0.1
vz_prof      = "const"
gs           = 980.0   # surface gravity (cm/s^2)
Tiso         = 1000.0
para_warm    = [120.0, 1500.0, 0.1, 0.02, 1.0, 1.0]
# para_anaTP omitted -> aliased to para_warm
const_Kzz    = 1.0e10
const_vz     = 0.0
update_frq   = 100
r_star       = 1.0     # stellar radius (R_sun)
Rp           = 6.3781e8   # planetary radius (cm)
orbit_radius = 1.0     # AU
sl_angle_deg = 58.0    # zenith angle (dayside-average for Earth)
f_diurnal    = 0.5     # diurnal-average factor (0.5 for non-tidally-locked)

[photochemistry]
use_photo              = true
use_ion                = false
scat_sp                = ["N2", "O2"]
T_cross_sp             = ["CO2", "H2O", "NH3"]   # slower start; T-dependent cross sections
edd                    = 0.5
dbin1                  = 0.1
dbin2                  = 2.0
dbin_12trans           = 240.0
ini_update_photo_frq   = 100
final_update_photo_frq = 5

[boundary_conditions]
use_topflux        = false
use_botflux        = true
diff_esc           = ["H2", "H"]   # diffusion-limited escape species
max_flux           = 1.0e13
use_sat_surfaceH2O = false

[boundary_conditions.use_fix_sp_bot]
# fixed mixing ratios at the lower boundary
H2O     = 0.00894    # ~20% humidity in US standard 1967
H2O_l_s = 0.0
CO2     = 4.0e-4

[condensation]
use_condense                  = true
use_settling                  = true
use_relax                     = ["H2O", "H2SO4"]
humidity                      = 0.25
start_conden_time             = 0.0
stop_conden_time              = 5.0e8        # ~20 yr; condensation freezes after this
# fix_species_time omitted -> aliased to stop_conden_time
condense_sp                   = ["H2O", "H2SO4"]
non_gas_sp                    = ["H2O_l_s", "H2SO4_l"]
fix_species                   = ["H2O", "H2O_l_s", "H2SO4", "H2SO4_l"]
fix_species_from_coldtrap_lev = true
use_ini_cold_trap             = true

[condensation.r_p]
H2O_l_s = 0.01      # particle radius (cm)  -- 100 micron
H2SO4_l = 1.0e-4    # 1 micron

[condensation.rho_p]
H2O_l_s = 0.9       # density (g/cm^3)
H2SO4_l = 1.8302

[solver]
ode_solver       = "Ros2"
use_print_prog   = true
use_print_delta  = false
print_prog_num   = 500
dttry            = 1.0e-10
trun_min         = 1.0e2
runtime          = 1.0e22
dt_min           = 1.0e-14
# dt_max omitted -> derived as runtime * 1e-5
dt_var_max       = 2.0
dt_var_min       = 0.5
count_min        = 120
count_max        = 20000
atol             = 1.0e-1
mtol             = 1.0e-22
mtol_conv        = 1.0e-16
pos_cut          = 0.0
nega_cut         = -1.0
loss_eps         = 1.0e12
yconv_cri        = 0.01
slope_cri        = 1.0e-4
yconv_min        = 0.1
flux_cri         = 0.1
flux_atol        = 1.0
st_factor        = 0.5
conv_step        = 500
rtol             = 1.0
post_conden_rtol = 0.05
use_adapt_rtol   = true
rtol_min         = 0.02
rtol_max         = 2.5

[output]
output_humanread = false
use_shark        = false
save_evolution   = false
save_evo_frq     = 10
y_time_freq      = 1

[plotting]
plot_TP        = false
use_live_plot  = true
use_live_flux  = false
use_plot_end   = false
use_plot_evo   = false
use_save_movie = false
use_flux_movie = false
plot_height    = false
use_PIL        = true
live_plot_frq  = 10
# save_movie_rate omitted -> aliased to live_plot_frq
plot_spec      = ["H2O", "H2O_l_s", "O3", "CH4", "NH3", "H2SO4", "N2O", "SO2"]
